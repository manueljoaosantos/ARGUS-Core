
[env:argus-maze]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
    -I include

build_src_filter =
    +<*>
    +<../lib/ArgusConfig/src/*.cpp>
    +<../lib/ArgusEncoders/src/*.cpp>
    +<../lib/ArgusLineFollower/src/*.cpp>
    +<../lib/ArgusLineSensors/src/*.cpp>
    +<../lib/ArgusMaze/src/*.cpp>
    +<../lib/ArgusMotors/src/*.cpp>
